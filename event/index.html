<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- 카카오톡 미리보기 (Open Graph) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="친구가 용돈 주기를 부탁했어요" />
  <meta property="og:description" content="나도 다람쥐 키우면 사랑을 받아요." />
  
  <!-- [수정 필수 1] 내아이디를 본인 GitHub 아이디로 변경하세요 -->
  <meta property="og:image" content="https://NotOohJean.github.io/event/thumbnail.png" />
  <meta property="og:url" content="https://NotOohJean.github.io/event/" />

  <title>친구 안우진에게 용돈 선물하기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* 모바일 화면 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, #ffffff 0%, #fffdf7 38%, #fdf0cb 75%, #fce3a1 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* 상단 네비게이션 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      height: 56px;
    }
    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .info-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #4e5968;
      font-weight: 500;
      cursor: pointer;
    }

    /* 프로그레스 게이지 영역 */
    .progress-section {
      padding: 8px 24px 0;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .progress-track {
      flex: 1;
      height: 10px;
      background-color: #e5e8eb;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 3%;
      height: 100%;
      background: linear-gradient(90deg, #ff9f00, #ffb800);
      border-radius: 999px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .money-bag-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    /* 모은 돈 텍스트 영역 */
    .status-text {
      text-align: center;
    }
    .status-label {
      font-size: 19px;
      font-weight: 700;
      color: #333d4b;
      margin-bottom: 8px;
      letter-spacing: -0.4px;
    }
    .status-amount {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
    }
    .current-money {
      font-size: 38px;
      font-weight: 800;
      color: #61320f;
      letter-spacing: -1px;
    }
    .target-money {
      font-size: 20px;
      font-weight: 600;
      color: #8b95a1;
    }

    /* 중앙 캐릭터 및 말풍선 영역 */
    .character-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      position: relative;
    }

    .speech-bubble {
      background: #ffffff;
      padding: 16px 26px;
      border-radius: 22px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      font-size: 17px;
      font-weight: 700;
      color: #333d4b;
      position: relative;
      margin-bottom: 22px;
      animation: floatBubble 2.6s ease-in-out infinite;
      cursor: pointer;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .squirrel-wrapper {
      width: 230px;
      height: 230px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .squirrel-wrapper:active {
      transform: scale(0.95);
    }

    .name-tag {
      margin-top: 14px;
      background-color: #f7d78c;
      color: #9c5100;
      font-size: 15px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 12px;
    }

    /* 하단 버튼 영역 */
    .bottom-area {
      padding: 12px 22px 28px;
    }
    .cta-btn {
      width: 100%;
      background-color: #c65800;
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 19px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(198, 88, 0, 0.22);
      transition: background-color 0.15s, transform 0.1s;
    }
    .cta-btn:active {
      background-color: #a84900;
      transform: scale(0.98);
    }

    /* 바텀시트 모달 (계좌번호 팝업) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .bottom-sheet {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px 28px 0 0;
      padding: 14px 24px 34px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
    }
    .modal-overlay.active .bottom-sheet {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #d1d6db;
      border-radius: 999px;
      margin: 0 auto 22px;
    }
    .sheet-title {
      font-size: 21px;
      font-weight: 800;
      color: #191f28;
      margin-bottom: 6px;
    }
    .sheet-desc {
      font-size: 15px;
      color: #6b7684;
      margin-bottom: 22px;
    }
    .account-card {
      background: #f9fafb;
      border: 1px solid #e5e8eb;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .bank-name {
      font-size: 14px;
      color: #4e5968;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .account-num {
      font-size: 21px;
      font-weight: 800;
      color: #191f28;
      letter-spacing: 0.5px;
      user-select: text;
    }
    .copy-btn {
      width: 100%;
      background-color: #c65800;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.2s;
    }
    .close-btn {
      width: 100%;
      background: #f2f4f6;
      color: #4e5968;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 상단 바 -->
    <div>
      <header class="top-bar">
        <button class="back-btn" onclick="openSheet()" aria-label="뒤로가기">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191f28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="info-btn" onclick="alert('친구 안우진에게 도토리 대신 따뜻한 용돈을 선물하는 패러디 페이지입니다 🐿️')">안내</button>
      </header>

      <!-- 상단 게이지 및 모은 돈 -->
      <section class="progress-section">
        <div class="progress-row">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <!-- 복주머니 아이콘 -->
          <svg class="money-bag-icon" viewBox="0 0 36 36" fill="none">
            <path d="M13 6L18 9L23 6L21 12H15L13 6Z" fill="#FFA800"/>
            <circle cx="18" cy="22" r="11" fill="#FFC700"/>
            <path d="M13.5 12C13.5 11.1716 14.1716 10.5 15 10.5H21C21.8284 10.5 22.5 11.1716 22.5 12C22.5 12.8284 21.8284 13.5 21 13.5H15C14.1716 13.5 13.5 12.8284 13.5 12Z" fill="#FF9900"/>
            <text x="18" y="26" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="900">₩</text>
          </svg>
        </div>

        <div class="status-text">
          <div class="status-label">지금까지 모은 돈</div>
          <div class="status-amount">
            <span class="current-money" id="currentMoney">0원</span>
            <span class="target-money">/ 10,000원</span>
          </div>
        </div>
      </section>
    </div>

    <!-- 중앙 다람쥐 캐릭터 & 말풍선 -->
    <main class="character-stage">
      <div class="speech-bubble" id="speechBubble" onclick="changeTalk()">
        내 밥도 잊지 않았지?
      </div>

      <!-- 3D 스타일 다람쥐 SVG (터치 시 대사 변경) -->
      <div class="squirrel-wrapper" onclick="changeTalk()">
        <svg viewBox="0 0 260 250" width="100%" height="100%">
          <defs>
            <radialGradient id="tailGrad" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#d28552"/>
              <stop offset="65%" stop-color="#9e562a"/>
              <stop offset="100%" stop-color="#7a3e18"/>
            </radialGradient>
            <radialGradient id="bodyGrad" cx="45%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#f0a86e"/>
              <stop offset="70%" stop-color="#d47f43"/>
              <stop offset="100%" stop-color="#ad5d26"/>
            </radialGradient>
            <radialGradient id="headGrad" cx="45%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#f5b37c"/>
              <stop offset="65%" stop-color="#dc884b"/>
              <stop offset="100%" stop-color="#b5642b"/>
            </radialGradient>
            <radialGradient id="creamGrad" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#fffdf9"/>
              <stop offset="100%" stop-color="#f2dec4"/>
            </radialGradient>
            <ellipse id="shadow" cx="140" cy="228" rx="62" ry="12" fill="rgba(160, 110, 40, 0.18)"/>
          </defs>

          <!-- 바닥 그림자 -->
          <use href="#shadow" />

          <!-- 풍성한 꼬리 -->
          <path d="M115 195 C45 205, 25 130, 58 95 C82 70, 118 88, 108 125 C102 145, 115 165, 128 182 Z" fill="url(#tailGrad)"/>
          <path d="M58 95 C42 110, 45 142, 72 150 C58 130, 68 105, 88 98 C78 90, 66 90, 58 95 Z" fill="#b86b3a" opacity="0.5"/>

          <!-- 뒷다리/발 -->
          <ellipse cx="115" cy="212" rx="22" ry="13" transform="rotate(-12 115 212)" fill="url(#bodyGrad)"/>
          <ellipse cx="176" cy="208" rx="22" ry="13" transform="rotate(15 176 208)" fill="url(#bodyGrad)"/>

          <!-- 몸통 -->
          <ellipse cx="145" cy="168" rx="42" ry="50" fill="url(#bodyGrad)"/>
          <!-- 배 크림색 털 -->
          <ellipse cx="152" cy="172" rx="25" ry="36" fill="url(#creamGrad)"/>

          <!-- 귀 (좌/우) -->
          <ellipse cx="112" cy="62" rx="16" ry="22" transform="rotate(-18 112 62)" fill="url(#headGrad)"/>
          <ellipse cx="114" cy="64" rx="9" ry="13" transform="rotate(-18 114 64)" fill="#c9713b"/>
          <ellipse cx="178" cy="62" rx="16" ry="22" transform="rotate(18 178 62)" fill="url(#headGrad)"/>
          <ellipse cx="176" cy="64" rx="9" ry="13" transform="rotate(18 176 64)" fill="#c9713b"/>

          <!-- 머리 -->
          <path d="M92 108 C92 66, 198 66, 198 108 C206 132, 185 150, 145 150 C105 150, 84 132, 92 108 Z" fill="url(#headGrad)"/>
          <!-- 이마 줄무늬 -->
          <path d="M138 68 Q145 92 152 68 Z" fill="#9e5220" opacity="0.65"/>

          <!-- 볼/입 주변 크림색 영역 -->
          <path d="M95 118 C95 104, 125 106, 145 116 C165 106, 195 104, 195 118 C198 138, 175 150, 145 150 C115 150, 92 138, 95 118 Z" fill="url(#creamGrad)"/>
          <!-- 볼터치 -->
          <ellipse cx="110" cy="124" rx="11" ry="7" fill="#ff8a75" opacity="0.35"/>
          <ellipse cx="180" cy="124" rx="11" ry="7" fill="#ff8a75" opacity="0.35"/>

          <!-- 불쌍한 눈썹 (복사 완료 시 바뀜) -->
          <g id="sadBrows">
            <path d="M112 92 Q122 96 128 89" stroke="#753912" stroke-width="3.2" stroke-linecap="round" fill="none"/>
            <path d="M178 92 Q168 96 162 89" stroke="#753912" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          </g>

          <!-- 초롱초롱한 눈 -->
          <g>
            <circle cx="123" cy="106" r="8.5" fill="#221712"/>
            <circle cx="120.5" cy="103" r="3" fill="#ffffff"/>
            <circle cx="125.5" cy="109" r="1.5" fill="#ffffff"/>

            <circle cx="167" cy="106" r="8.5" fill="#221712"/>
            <circle cx="164.5" cy="103" r="3" fill="#ffffff"/>
            <circle cx="169.5" cy="109" r="1.5" fill="#ffffff"/>
          </g>

          <!-- 코와 입 -->
          <ellipse cx="145" cy="117" rx="5.5" ry="4" fill="#6e3312"/>
          <path id="mouthPath" d="M139 127 Q145 122 151 127" stroke="#6e3312" stroke-width="2.5" stroke-linecap="round" fill="none"/>

          <!-- 공손히 모은 두 손 -->
          <ellipse cx="134" cy="158" rx="14" ry="11" transform="rotate(20 134 158)" fill="url(#headGrad)"/>
          <ellipse cx="156" cy="158" rx="14" ry="11" transform="rotate(-20 156 158)" fill="url(#headGrad)"/>
        </svg>
      </div>

      <div class="name-tag">내 다람쥐 (안우진)</div>
    </main>

    <!-- 하단 주황색 버튼 -->
    <footer class="bottom-area">
      <button class="cta-btn" onclick="openSheet()">다람쥐한테 밥 주기</button>
    </footer>
  </div>

  <!-- 계좌번호 안내 바텀시트 모달 -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeSheet(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">안우진 다람쥐에게 용돈 주기 🐿️</div>
      <div class="sheet-desc">도토리 대신 아래 계좌로 따뜻한 마음을 보내주세요!</div>

      <div class="account-card">
        <!-- [수정 필수 2] 본인 은행명과 계좌번호로 변경하세요 -->
        <div class="bank-name">하나은행 (예금주: 안우진)</div>
        <div class="account-num" id="accNum">123-456789-01234</div>
      </div>

      <button class="copy-btn" id="copyBtn" onclick="copyAccount()">계좌번호 복사하고 밥 주기</button>
      <button class="close-btn" onclick="closeSheet()">닫기</button>
    </div>
  </div>

  <script>
    const talks = [
      "내 밥도 잊지 않았지?",
      "배고파서 현기증 난단 말이야...",
      "도토리 대신 현금도 잘 먹어!",
      "10,000원이면 다람쥐가 행복해져요",
      "우진이 커피 한 잔만 사주라 ☕"
    ];
    let talkIdx = 0;

    function changeTalk() {
      talkIdx = (talkIdx + 1) % talks.length;
      document.getElementById("speechBubble").innerText = talks[talkIdx];
    }

    function openSheet() {
      document.getElementById("modalOverlay").classList.add("active");
    }

    function closeSheet() {
      document.getElementById("modalOverlay").classList.remove("active");
    }

    function copyAccount() {
      const acc = document.getElementById("accNum").innerText;
      navigator.clipboard.writeText(acc).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerText = "계좌번호 복사 완료! 💸";
        copyBtn.style.backgroundColor = "#00b464";

        // 상단 게이지 & 금액 10,000원으로 채우기 연출
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("currentMoney").innerText = "10,000원";
        document.getElementById("speechBubble").innerText = "고마워! 은행 앱에 붙여넣어 줘 ❤️";
        
        // 다람쥐 입모양을 웃는 표정으로 변경
        document.getElementById("mouthPath").setAttribute("d", "M138 124 Q145 132 152 124");

        setTimeout(() => {
          closeSheet();
          copyBtn.innerText = "계좌번호 복사하고 밥 주기";
          copyBtn.style.backgroundColor = "#c65800";
        }, 1400);
      });
    }
  </script>
</body>
</html>
